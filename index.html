<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Реберня — на !FESTrepublic</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 50% 8%,rgba(170,0,0,.45),transparent 30%),
      radial-gradient(circle at 15% 55%,rgba(100,0,0,.35),transparent 32%),
      radial-gradient(circle at 90% 80%,rgba(170,0,0,.28),transparent 30%),
      linear-gradient(145deg,#050505 0%,#160000 45%,#050505 100%);
}
body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.16;
    background:
      repeating-linear-gradient(135deg,transparent 0 13px,#fff 14px 15px,transparent 16px 28px);
    mix-blend-mode:overlay;
}
body:after{
    content:"";
    position:fixed;
    width:500px;height:500px;
    left:50%;top:18%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,rgba(210,20,20,.18),transparent 65%);
    filter:blur(25px);
    pointer-events:none;
}
.container{
    position:relative;
    z-index:2;
    width:min(440px,100%);
    margin:auto;
    padding:32px 18px 28px;
    text-align:center;
}
.logo-wrap{
    width:190px;height:190px;
    margin:0 auto 18px;
    border-radius:50%;
    padding:7px;
    background:#fff;
    box-shadow:0 0 0 3px #111,0 0 35px rgba(220,20,20,.55);
}
.logo{
    width:100%;height:100%;
    border-radius:50%;
    object-fit:contain;
    display:block;
}
h1{
    margin:0;
    font-size:36px;
    font-weight:950;
    letter-spacing:3px;
    text-transform:uppercase;
}
.tagline{
    margin:8px 0 25px;
    color:#ddd;
    font-size:15px;
    font-weight:600;
}
.fire{
    color:#e21a1a;
    font-size:22px;
    margin-bottom:7px;
}
.links{
    display:flex;
    flex-direction:column;
    gap:14px;
}
.button{
    position:relative;
    min-height:66px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:13px;
    padding:12px 20px;
    border-radius:17px;
    color:#fff;
    text-decoration:none;
    font-size:18px;
    font-weight:900;
    letter-spacing:.5px;
    border:1px solid rgba(255,255,255,.22);
    box-shadow:0 8px 24px rgba(0,0,0,.45);
    overflow:hidden;
}
.button:before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.09),transparent);
    transform:translateX(-100%);
    transition:.35s;
}
.button:hover:before{transform:translateX(100%)}
.button:hover{transform:translateY(-2px)}
.instagram{background:linear-gradient(135deg,#5b167d,#d71938,#ef8c21)}
.tiktok{background:linear-gradient(135deg,#050505,#171717);border-color:#555}
.google{background:linear-gradient(135deg,#111,#3a0909);border:1px solid #c9c9c9}
.icon{
    width:38px;height:38px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    background:rgba(0,0,0,.35);
    font-size:23px;
}
.icon svg{width:25px;height:25px;display:block}\n.small{
    display:block;
    margin-top:22px;
    color:#888;
    font-size:12px;
}
.badge{
    display:inline-block;
    margin:0 auto 16px;
    padding:6px 13px;
    border:1px solid #a51a1a;
    border-radius:999px;
    color:#eee;
    background:rgba(120,0,0,.18);
    font-size:11px;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;
}
</style>
</head>
